<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>P31 Google Business Profile images</title>
<style>
  @font-face { font-family: 'Noto Serif'; font-weight: 400; src: url(../../../public/fonts/NotoSerif-400.woff2) format('woff2'); }
  @font-face { font-family: 'Noto Serif'; font-weight: 400; font-style: italic; src: url(../../../public/fonts/NotoSerif-400-italic.woff2) format('woff2'); }
  @font-face { font-family: 'Manrope'; font-weight: 800; src: url(../../../public/fonts/Manrope-800.woff2) format('woff2'); }
  @font-face { font-family: 'Manrope'; font-weight: 400; src: url(../../../public/fonts/Manrope-400.woff2) format('woff2'); }
  html, body { margin: 0; }
  body { font-family: Manrope, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  /* Logo: Google shows it in a circle; the mark sits inside the safe circle with room to spare. */
  #logo { position: relative; width: 1024px; height: 1024px; overflow: hidden; display: grid; place-items: center;
    background: radial-gradient(70% 70% at 30% 20%, #4a1f78 0%, #2a1544 55%, #1d0f2e 100%); }
  #logo img { width: 640px; height: 640px; filter: drop-shadow(0 18px 36px rgba(0, 0, 0, 0.35)); }
  /* Cover: 16:9, text kept inside the middle so Google's crops on phones do not cut it. */
  #cover { position: relative; width: 2120px; height: 1192px; overflow: hidden;
    background: radial-gradient(900px 600px at 85% 15%, rgba(242, 206, 77, 0.22), transparent 60%), linear-gradient(135deg, #4a1f78 0%, #2a1544 55%, #1d0f2e 100%); }
  #cover::before { content: ''; position: absolute; inset: 0; background: radial-gradient(700px 700px at 15% 110%, rgba(168, 85, 232, 0.25), transparent 60%); }
  .arch { position: absolute; left: 50%; bottom: -200px; width: 1900px; height: 1200px; transform: translateX(-50%); border: 2px solid rgba(242, 206, 77, 0.22); border-bottom: 0; border-radius: 950px 950px 0 0; }
  .inner { position: absolute; inset: 0; display: grid; grid-template-columns: 520px 1fr; gap: 90px; align-items: center; padding: 0 200px; }
  .mark { width: 520px; height: 520px; filter: drop-shadow(0 30px 60px rgba(0, 0, 0, 0.4)); }
  .eyebrow { margin: 0 0 22px; font-size: 32px; font-weight: 800; letter-spacing: 0.3em; text-transform: uppercase; color: #F2CE4D; }
  h1 { margin: 0; font-family: 'Noto Serif', Georgia, serif; font-weight: 400; font-size: 136px; line-height: 1.02; letter-spacing: -0.02em; }
  h1 em { font-style: italic; color: #F2CE4D; }
  .lead { margin: 34px 0 0; font-size: 40px; line-height: 1.4; color: rgba(255, 255, 255, 0.8); max-width: 1000px; }
  .url { position: absolute; right: 200px; bottom: 90px; font-size: 34px; font-weight: 800; letter-spacing: 0.12em; color: rgba(255, 255, 255, 0.85); }
</style>
</head>
<body>
  <div id="logo"><img src="../../brand/mark.png" alt="" /></div>
  <div id="cover">
    <span class="arch"></span>
    <div class="inner">
      <img class="mark" src="../../brand/mark.png" alt="" />
      <div>
        <p class="eyebrow">Atlanta · Traveling marketplace</p>
        <h1>Where her gifts<br /><em>make room.</em></h1>
        <p class="lead">A curated marketplace for women creatives, artisans and faith-driven entrepreneurs.</p>
      </div>
    </div>
    <span class="url">P31MARKET.COM</span>
  </div>
</body>
</html>
