// Synth audio player using Web Audio API to play P31 chord voicings
let audioCtx = null;
let currentOscs = [];
let playingId = null;

function stopAudio() {
  currentOscs.forEach(o => {
    try { o.stop(); o.disconnect(); } catch(e){}
  });
  currentOscs = [];
  if (playingId) {
    const btn = document.getElementById(`btn-${playingId}`);
    if (btn) { btn.textContent = '▶ Play Music'; btn.classList.remove('playing'); }
    playingId = null;
  }
}

function playTrack(id, key) {
  if (playingId === id) {
    stopAudio();
    return;
  }
  stopAudio();
  playingId = id;
  const btn = document.getElementById(`btn-${id}`);
  if (btn) { btn.textContent = '⏹ Stop Music'; btn.classList.add('playing'); }

  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const now = audioCtx.currentTime;
  const master = audioCtx.createGain();
  master.gain.setValueAtTime(0.18, now);
  master.connect(audioCtx.destination);

  // Chords based on mood key
  const progressions = {
    'golden-hour': [[60, 64, 67, 71], [62, 65, 69, 72], [65, 69, 72, 76], [67, 71, 74, 77]], // Neo-soul maj9/m7
    'boss-moves': [[48, 55, 60], [46, 53, 58], [44, 51, 56], [43, 50, 55]], // Minor trap root-5th
    'sunday-keys': [[53, 57, 60, 65], [58, 62, 65, 69], [55, 58, 62, 67], [52, 55, 59, 64]], // Gospel turnaround
    'worship-rise': [[57, 60, 64, 69], [53, 57, 60, 65], [60, 64, 67, 72], [55, 59, 62, 67]], // Contemporary praise
    'bright-open': [[60, 64, 67], [65, 69, 72], [67, 71, 74], [65, 69, 72]], // Upbeat pop
    'lofi-grind': [[62, 65, 69, 72], [67, 71, 74, 77], [60, 64, 67, 71], [65, 69, 72, 76]], // Lo-fi 2-5-1
    'still-waters': [[53, 60, 64], [57, 60, 65], [52, 59, 64], [50, 57, 62]], // Warm open acoustic
    'sunday-best': [[60, 64, 67], [65, 69, 72], [67, 71, 75], [60, 64, 67]] // Celebration
  };

  const chords = progressions[key] || progressions['golden-hour'];
  const beatLen = 1.4;

  chords.forEach((chord, i) => {
    chord.forEach(midi => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const freq = 440 * Math.pow(2, (midi - 69) / 12);
      osc.type = key === 'boss-moves' ? 'sawtooth' : key === 'worship-rise' ? 'triangle' : 'sine';
      osc.frequency.setValueAtTime(freq, now + i * beatLen);

      gain.gain.setValueAtTime(0, now + i * beatLen);
      gain.gain.linearRampToValueAtTime(0.2, now + i * beatLen + 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, now + (i + 1) * beatLen);

      osc.connect(gain);
      gain.connect(master);

      osc.start(now + i * beatLen);
      osc.stop(now + (i + 1) * beatLen);
      currentOscs.push(osc);
    });
  });

  setTimeout(() => {
    if (playingId === id) stopAudio();
  }, chords.length * beatLen * 1000);
}
